name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm grammar:download
      - run: pnpm grammar:states -- --check
      - run: pnpm grammar:generate
      - run: pnpm verify
      - run: pnpm conformance -- --manifest corpora/public/manifest.json --experiment ci-conformance
      - run: pnpm benchmark:quick
      - run: docker build -f java/Dockerfile -t oracle-antlr-lab-java:0.1.0 .
      - run: docker run --rm --network none -v "$PWD/corpora/public:/corpus:ro" oracle-antlr-lab-java:0.1.0 pass /corpus/files/edge_q_quote.sql
